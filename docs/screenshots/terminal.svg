  <text x="100" y="252" fill="#d7e6dd" font-family="monospace" font-size="16">TRACE / LOCAL-FIRST WEB INTELLIGENCE</text>
  <text x="100" y="284" fill="#91a89b" font-family="monospace" font-size="14">Read-only collection. Targets are validated before every request.</text>
  <text x="100" y="332" fill="#66e3a6" font-family="monospace" font-size="16">$ trace scan example.com</text>
  <text x="100" y="372" fill="#66e3a6" font-family="monospace" font-size="16">[+] TARGET        example.com</text>
  <text x="100" y="402" fill="#66e3a6" font-family="monospace" font-size="16">[+] DNS           OK</text>
  <text x="100" y="432" fill="#66e3a6" font-family="monospace" font-size="16">[+] TLS           VALID</text>
  <text x="100" y="462" fill="#66e3a6" font-family="monospace" font-size="16">[+] HTTP          200</text>
  <text x="100" y="492" fill="#66e3a6" font-family="monospace" font-size="16">[+] REDIRECTS     0</text>
  <text x="100" y="522" fill="#66e3a6" font-family="monospace" font-size="16">[+] TECHNOLOGY    nginx</text>
  <text x="100" y="552" fill="#66e3a6" font-family="monospace" font-size="16">[+] CASE          CASE-00001</text>
  <rect x="76" y="640" width="930" height="48" rx="4" fill="#10191d" stroke="#273a40"/>
  <text x="96" y="671" fill="#91a89b" font-family="monospace" font-size="15">trace scan example.com</text>
