name: Android build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

env:
  JAVA_VERSION: '17'

jobs:
  build:
    name: Build and test APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Build debug APK
        run: ./gradlew testDebugUnitTest assembleDebug --stacktrace
      - name: Rename APK
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            cp app/build/outputs/apk/debug/app-debug.apk TRACE-${VERSION}-android.apk
          else
            cp app/build/outputs/apk/debug/app-debug.apk TRACE-${GITHUB_SHA}-android.apk
          fi
      - name: Generate APK checksum
        shell: bash
        run: |
          for apk in TRACE-*.apk; do [[ -f "$apk" ]] && sha256sum "$apk" > "$apk.sha256"; done
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: trace-apk-${{ github.run_number }}
          path: |
            TRACE-*.apk
            TRACE-*.apk.sha256
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: gh release upload "${GITHUB_REF_NAME}" "TRACE-${GITHUB_REF_NAME#v}-android.apk" "TRACE-${GITHUB_REF_NAME#v}-android.apk.sha256" --repo "${GITHUB_REPOSITORY}" --clobber
        env:
          GH_TOKEN: ${{ github.token }}
