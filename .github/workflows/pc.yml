name: PC build matrix
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    name: PC ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            runner: windows-latest
          - platform: linux-x64
            runner: ubuntu-latest
          - platform: macos-arm64
            runner: macos-14
          - platform: macos-x64
            runner: macos-13
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build PC client
        shell: bash
        env:
          TRACE_PLATFORM: ${{ matrix.platform }}
        run: bash pc/scripts/build-platform.sh
      - name: Upload PC package artifact
        uses: actions/upload-artifact@v4
        with:
          name: trace-${{ matrix.platform }}-${{ github.run_number }}
          path: |
            pc/dist/TRACE-3.0.0-*.*
            pc/dist/TRACE-3.0.0-*/
      - name: Publish tagged PC release assets
        if: startsWith(github.ref, 'refs/tags/v3.0.0')
        shell: bash
        run: |
          shopt -s nullglob
          files=(pc/dist/TRACE-3.0.0-*.zip pc/dist/TRACE-3.0.0-*.tar.gz pc/dist/TRACE-3.0.0-*.sha256)
          if ((${#files[@]})); then gh release upload v3.0.0 "${files[@]}" --repo "${GITHUB_REPOSITORY}" --clobber; fi
        env:
          GH_TOKEN: ${{ github.token }}
